name: Compile The New Version ndsvoucher

on:
  push:
    branches:
      - dev
    paths:
      - 'luci-app-ndsvoucher/Makefile'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Get-Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      current_version: ${{ steps.current_version.outputs.version }}
    steps:
      - name: Checkout Source Branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Get New Version
        id: version
        run: |
          V=$(grep 'PKG_VERSION:=' ./luci-app-ndsvoucher/Makefile | awk -F '=' '{print $2}' | tr -d ' \r\n')
          if [ -z "$V" ]; then
            echo "::error::PKG_VERSION not found in Makefile"
            exit 1
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "New version: $V"

      - name: Ensure Package Branch Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              package > /dev/null 2>&1; then
            echo "Branch 'package' already exists."
          else
            echo "Branch 'package' not found. Creating it..."
            cd /tmp
            git clone --depth=1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              repo-tmp
            cd repo-tmp
            git checkout --orphan package
            git rm -rf . || true
            mkdir -p main dev
            echo "v0.0.0" > main/version
            echo "v0.0.0" > dev/version
            git add .
            git commit -m "Init package branch"
            git push origin package
            echo "Branch 'package' created."
          fi

      - name: Clone Package Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth=1 --branch=package \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            pkg-branch

      - name: Get Current Version
        id: current_version
        run: |
          VERSION_FILE="./pkg-branch/${{ github.ref_name }}/version"
          if [ -f "$VERSION_FILE" ]; then
            V=$(sed -n 1p "$VERSION_FILE" | awk -F 'v' '{print $2}' | tr -d ' \r\n')
          else
            V="0.0.0"
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Current version: $V"

  Compile:
    runs-on: ubuntu-latest
    needs: Get-Version
    if: ${{ needs.Get-Version.outputs.version != '' && needs.Get-Version.outputs.version != needs.Get-Version.outputs.current_version }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: ipk
            sdk_url: "https://archive.openwrt.org/releases/18.06.9/targets/ar71xx/tiny/openwrt-sdk-18.06.9-ar71xx-tiny_gcc-7.3.0_musl.Linux-x86_64.tar.xz"
            sdk_tar: "SDK.tar.xz"
            sdk_dir: "SDK"
            artifact_pattern: "luci-app-ndsvoucher_*.ipk"
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install curl git tar xz-utils python3 python3-pyelftools python3-setuptools

      - name: Download SDK
        run: |
          mkdir -p tmp
          curl -SLk --connect-timeout 30 --retry 3 \
            "${{ matrix.target.sdk_url }}" \
            -o "./tmp/${{ matrix.target.sdk_tar }}"
          cd tmp
          tar xf ${{ matrix.target.sdk_tar }}
          mv openwrt-sdk-* ${{ matrix.target.sdk_dir }}
          echo "--- SDK directory contents ---"
          ls -la ${{ matrix.target.sdk_dir }}/

      - name: Copy ndsvoucher Source Code
        run: |
          mkdir -p tmp/${{ matrix.target.sdk_dir }}/package/luci-app-ndsvoucher
          cp -rf ./luci-app-ndsvoucher/. tmp/${{ matrix.target.sdk_dir }}/package/luci-app-ndsvoucher/
          echo "--- Package contents ---"
          ls -la tmp/${{ matrix.target.sdk_dir }}/package/luci-app-ndsvoucher/

      - name: Install Feeds
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Compile ndsvoucher
        run: |
          cd tmp/${{ matrix.target.sdk_dir }}
          make defconfig
          make package/luci-app-ndsvoucher/compile V=99

      - name: Verify Artifact Exists
        run: |
          PATTERN="tmp/${{ matrix.target.sdk_dir }}/bin/packages/*/base/${{ matrix.target.artifact_pattern }}"
          if ! ls $PATTERN 1> /dev/null 2>&1; then
            echo "::error::Artifact not found with pattern: $PATTERN"
            echo "--- Listing bin/packages/ ---"
            find tmp/${{ matrix.target.sdk_dir }}/bin/packages/ -type f 2>/dev/null || true
            exit 1
          fi
          echo "Artifact found:"
          ls -la $PATTERN

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndsvoucher-${{ matrix.target.name }}
          path: tmp/${{ matrix.target.sdk_dir }}/bin/packages/*/base/${{ matrix.target.artifact_pattern }}
          if-no-files-found: error

  Post-Process:
    runs-on: ubuntu-latest
    needs: [Compile, Get-Version]
    if: ${{ needs.Compile.result == 'success' }}
    steps:
      - name: Checkout Package Branch
        uses: actions/checkout@v5
        with:
          ref: package
          fetch-depth: 0

      - name: Download IPK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ndsvoucher-ipk
          path: ./ipk

      - name: List Downloaded Files
        run: |
          echo "--- IPK files ---"
          ls -laR ./ipk/ || true

      - name: Prepare Branch Directory
        run: |
          mkdir -p ./${{ github.ref_name }}

      - name: Commit and Push New Version
        run: |
          # Cari file .ipk di mana pun di dalam ./ipk/
          IPK_FILE=$(find ./ipk -name "luci-app-ndsvoucher_*.ipk" | head -n 1)
          if [ -z "$IPK_FILE" ]; then
            echo "::error::No IPK file found in downloaded artifact."
            exit 1
          fi
          echo "Found IPK: $IPK_FILE"

          rm -f ./${{ github.ref_name }}/luci-app-ndsvoucher_*.ipk

          echo "v${{ needs.Get-Version.outputs.version }}" > ./${{ github.ref_name }}/version
          echo "https://img.shields.io/badge/New Release-v${{ needs.Get-Version.outputs.version }}-orange.svg" >> ./${{ github.ref_name }}/version

          cp "$IPK_FILE" "./${{ github.ref_name }}/"

          if [ -f ./${{ github.ref_name }}/README.md ]; then
            sed -i -E "s|source code-v[0-9.]+-green|source code-v${{ needs.Get-Version.outputs.version }}-green|g" ./${{ github.ref_name }}/README.md || true
            sed -i -E "s|New Release-v[0-9.]+-orange|New Release-v${{ needs.Get-Version.outputs.version }}-orange|g" ./${{ github.ref_name }}/README.md || true
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto Release: v${{ needs.Get-Version.outputs.version }}"
            git push
          fi